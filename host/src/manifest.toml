# Built-in application manifest, compiled into the updater. Operators override per-app
# settings in config.toml ([apps.<id>]) and never need to edit this file.
#
# Every app listed here is installed and kept up to date unless an operator disables it. The
# defaults follow the Craft App Suite's conventions, so a new app usually needs only its section:
#
# - name, tagline, brand colors, publisher (official or community) and product page come from
#   the ArtCraft Launcher catalogue vendored in host/assets/vendor/craft-launcher
#   (scripts/sync-craft-launcher.py);
# - repository = the catalogue's (a community app's own, e.g. tangency-labs/solidcraft), else
#   "storytold/<id>";
# - artifact_patterns = "<id>-web-{version}.zip", plus the same for each former id in the
#   catalogue (PdfCraft shipped printcraft-web-<v>.zip up to v0.2.1);
# - the launcher logo is host/assets/icons/<id>.webp (getartcraft.com/images/apps/<id>/icon.webp),
#   or <id>.png for a community app without a page there (the icon ArtCraft Launcher embeds).
#
# Every official release surveyed on 2026-10-12 ships `<id>-web-<version>.zip` holding one
# top-level directory with a static site whose index.html uses relative URLs only, plus
# SHA256SUMS.txt. See docs/apps.md.

[apps.photocraft]
notes = "Content-hashed asset names. WebGPU needs a secure context; falls back to WebGL2."

[apps.vectorcraft]
notes = "Content-hashed asset names. WebGPU needs a secure context; falls back to WebGL2."

[apps.filmcraft]
notes = "Projects live in browser storage (OPFS) for the serving origin."

[apps.lightcraft]
# Since v0.4.0 the web archive also contains a Cargo target directory (native build scripts,
# .so and .rlib files). The site never references it; exclude it rather than publish it.
exclude = [
  ".fingerprint/**",
  "build/**",
  "deps/**",
  "examples/**",
  "incremental/**",
  ".cargo-lock",
  ".cargo-build-lock",
  ".cargo-artifact-lock",
]
notes = "Experimental upstream. The library lives in browser storage for the serving origin; one tab at a time. Ships precompressed .gz copies."

[apps.pdfcraft]
notes = "Repository renamed from storytold/printcraft; web artifacts were named printcraft-web up to v0.2.1."

[apps.effectcraft]
notes = "Registers a service worker scoped to its release directory. Projects live in browser storage for the serving origin."

[apps.designcraft]
notes = "Content-hashed asset names. WebGPU needs a secure context; falls back to WebGL2."

[apps.wordcraft]

[apps.deckcraft]

[apps.gridcraft]

[apps.cadcraft]

[apps.soundcraft]
notes = "Plays audio through WebAudio; no cross-origin isolation headers needed."

[apps.figcraft]

[apps.solidcraft]
notes = "Community app by Tangency Labs (tangency-labs/solidcraft), in the ArtCraft Launcher catalogue since 0.10.0. Ships a service worker (sw.js)."
