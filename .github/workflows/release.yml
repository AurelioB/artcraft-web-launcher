name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

# One build per branch or tag; a newer push to main replaces an unfinished edge build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Nothing is published unless the exact source passes formatting, lints and tests.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Each architecture builds on a native runner (arm64 under emulation took ~40 minutes); the
  # per-architecture images are pushed by digest and combined into one tag below.
  image:
    needs: verify
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' host/Cargo.toml | head -n1)
          test "${GITHUB_REF_NAME#v}" = "$crate" || {
            echo "tag $GITHUB_REF_NAME does not match host/Cargo.toml version $crate"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image version and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aureliob/craft-host
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Craft Apps Host
            org.opencontainers.image.description=Self-hosted Craft browser apps and update service
            org.opencontainers.image.source=https://github.com/AurelioB/craft-server
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./host
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=ghcr.io/aureliob/craft-host,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,scope=image-${{ matrix.platform }},mode=max
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  # One multi-platform tag (X.Y.Z, or edge for main) from the per-architecture digests.
  image-merge:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aureliob/craft-host
          # Shared tags (X.Y, latest) are promoted separately, see below.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Publish the multi-platform tag
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<<"$TAGS"
          for digest in *; do args+=("ghcr.io/aureliob/craft-host@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$(head -n1 <<<"$TAGS")"
      # Releases can finish out of order (two tags pushed close together). Point X.Y and latest
      # at this version only if it is the newest of its minor series / of all releases, judged
      # from the tags that exist now, after the build.
      - name: Promote X.Y and latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --tags --force --quiet origin
          this="${GITHUB_REF_NAME#v}"
          case "$this" in *-*) echo "pre-release $this: shared tags unchanged"; exit 0 ;; esac
          stable() { git tag -l "$1" | sed 's/^v//' | grep -v -- - | sort -V | tail -n1; }
          minor="${this%.*}"
          image=ghcr.io/aureliob/craft-host
          tags=()
          if [ "$this" = "$(stable "v$minor.*")" ]; then tags+=(-t "$image:$minor"); fi
          if [ "$this" = "$(stable 'v*.*.*')" ]; then tags+=(-t "$image:latest"); fi
          if [ ${#tags[@]} -eq 0 ]; then echo "$this is not the newest release: shared tags unchanged"; exit 0; fi
          docker buildx imagetools create "${tags[@]}" "$image:$this"
          echo "promoted $this: ${tags[*]}"

  binaries:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Export static musl binary
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          docker buildx build --platform "$PLATFORM" --target binary \
            --build-arg "VERSION=${VERSION#v}" \
            --output "type=local,dest=$RUNNER_TEMP/export" ./host
      - name: Package binary
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          tar -C "$RUNNER_TEMP/export" -czf \
            "craft-host-${VERSION#v}-${ARCH}-linux-musl.tar.gz" craft-host
      - uses: actions/upload-artifact@v4
        with:
          name: craft-host-${{ matrix.arch }}-linux-musl
          path: craft-host-*.tar.gz
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image-merge, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: craft-host-*-linux-musl
          merge-multiple: true
      - name: Prepare checksums and release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sha256sum craft-host-*.tar.gz > SHA256SUMS
          awk -v version="${VERSION#v}" '
            $0 ~ "^## \\[" version "\\]([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            craft-host-*.tar.gz
            SHA256SUMS
